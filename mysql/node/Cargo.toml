[package]
name = "turso_mysql_node"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Node.js addon embedding the Turso MySQL frontend in-process"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
napi = { version = "3.8.3", default-features = false, features = ["napi6"] }
napi-derive = { version = "3.5.2", default-features = true }
turso_mysql = { workspace = true }
turso_mysql_server = { workspace = true }

[build-dependencies]
napi-build = "2.3.1"

[lints]
workspace = true
